<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- VK Bridge (обязательно для стабильной работы Mini Apps) -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <!-- Шрифты (опционально, но делает приложение намного стильнее) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ИКОНКИ -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

  <!-- SEO и описание для каталога ВК -->
  <title>AniWave Radio — Аниме музыка 24/7</title>
  <meta name="description"
    content="Слушайте лучшее аниме радио: J-Pop, Lo-Fi, OST и City Pop. 15+ станций, таймер сна, рейтинг и избранное." />

  <!-- Open Graph для красивых превью при шеринге в ВК -->
  <meta property="og:title" content="AniWave Radio" />
  <meta property="og:description" content="Лучшее аниме радио с J-Pop, Lo-Fi и OST. Слушай бесплатно!" />

  <!-- ⚠️ ВАЖНО: Замените 'ваш-домен.com' на реальный адрес вашего хостинга (например, vercel.app или github.io) -->
  <meta property="og:image" content="https://ваш-домен.com/background.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ваш-домен.com/" />

  <!-- Цвет темы браузера на мобильных (совпадает с фоном плеера) -->
  <meta name="theme-color" content="#1a0a2e" />

  <style>
    /* Базовый сброс и шрифт для мгновенного отображения до загрузки React */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a0a2e;
      /* Цвет фона до загрузки приложения */
      color: #ffffff;
    }

    #root {
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
